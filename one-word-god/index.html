<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE WORD GOD — 神託と文明</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101d24;color:#eee9da}*{box-sizing:border-box}body{margin:0}header{padding:14px 18px;border-bottom:1px solid #345057;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}h1{font-size:19px;color:#edc78d;margin:0}h2{font-size:15px;color:#edc78d;margin:0 0 10px}small,.muted{color:#a9bdbe}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:12px;max-width:1400px;margin:auto}.panel{background:#192b33;border:1px solid #36515a;border-radius:12px;padding:12px;min-width:0}aside{display:grid;align-content:start;gap:12px}button{background:#284049;border:1px solid #527077;color:#f5f2e9;padding:9px 12px;border-radius:9px;cursor:pointer;font:inherit}button:active,button.active{background:#506f6c}#world{width:100%;height:auto;background:#1b3339;border-radius:8px;display:block;touch-action:manipulation}.controls,.words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.words button{flex:1 0 21%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stats>div{padding:10px;background:#263c43;border-radius:8px;text-align:center}.stats b{display:block;font-size:20px}.stats small{font-size:10px}.log{max-height:390px;overflow:auto}.entry{padding:8px 0;border-top:1px solid #36515a;font-size:12px;line-height:1.6}.entry em{color:#e8c18c;font-style:normal}.detail{font-size:13px;line-height:1.8;min-height:125px}.legend{color:#a9bdbe;font-size:11px;margin-top:7px}footer{color:#9db2b5;font-size:11px;text-align:center;padding:13px}@media(max-width:800px){main{grid-template-columns:1fr}header{padding:12px}#world{max-height:70vh}aside{grid-template-columns:1fr}.words button{min-width:19%}} 
</style></head><body>
<header><h1>ONE WORD GOD <small>— 一語の神託</small></h1><small>自律文明シミュレーション / Prototype 0.1</small></header>
<main><section class="panel"><div class="controls"><button id="play">▶ 再生</button><button data-speed="1">×1</button><button data-speed="4">×4</button><button data-speed="12">×12</button><button id="reset">新世界</button><span id="date" class="muted"></span></div><canvas id="world" width="900" height="580"></canvas><div class="legend">集落をタップすると詳細を表示。神託はすべての文明へ同時に伝はります。</div></section>
<aside><section class="panel"><h2>世界の状況</h2><div class="stats"><div><b id="pop">0</b><small>総人口</small></div><div><b id="cities">0</b><small>集落数</small></div><div><b id="conflict">0</b><small>紛争数</small></div></div></section>
<section class="panel"><h2>神託を告げる</h2><div class="words" id="words"></div><div id="oracle-note" class="detail muted">一語を選ぶと、各文明が現在の状況に応じて解釈します。</div></section>
<section class="panel"><h2>選択中の集落</h2><div id="detail" class="detail muted">地図上の集落をタップして下さい。</div></section>
<section class="panel"><h2>年代記</h2><div id="log" class="log"></div></section></aside></main><footer>ONE WORD GOD — God speaks. Humanity interprets.</footer>
<script>
'use strict';
const canvas=document.querySelector('#world'),cx=canvas.getContext('2d'),W=900,H=580,words=['育て','守れ','分けろ','集めろ','進め','許せ','燃やせ','待て'];
const cultures=['河谷','高原','海岸','森','草原','湖沼','山岳','島嶼'],names=['アリア','ベルタ','サリム','ノヴァ','エルン','ミラ','カディ','オルム'];
const palettes=['#e4ba6c','#e48b80','#95c8a7','#b6a4e0','#d7a0b1','#85b8d3','#c0c78b','#edae81'];
let rng,seed,year,towns,events,selected,playing=false,speed=1,warCount=0,oracleCount=0;
function random(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}
function range(a,b){return a+random()*(b-a)}function choose(a){return a[Math.floor(random()*a.length)]}function clip(x,a,b){return Math.max(a,Math.min(b,x))}
function log(t){events.unshift({year,text:t});events=events.slice(0,160)}
function init(){seed=(Math.random()*4294967295)>>>0;year=0;events=[];selected=0;warCount=0;oracleCount=0;towns=names.map((name,i)=>({id:i,name,x:110+(i%4)*215+range(-27,27),y:130+Math.floor(i/4)*270+range(-55,55),population:Math.round(range(75,220)),food:range(90,210),wood:range(25,65),tech:range(.5,2),faith:range(.25,.9),wealth:range(15,70),stability:range(48,85),military:range(10,50),culture:cultures[i],color:palettes[i],belief:{share:range(0,1),defend:range(0,1),explore:range(0,1)},last:'まだ神託はない',wars:0}));log('世界が生まれ、八つの共同体が生活を始めた。');drawAll()}
function annual(){year++;towns.forEach(t=>{if(t.population<3)return;const yieldFood=t.population*(.75+Math.min(t.tech,8)*.1)*range(.8,1.2);const consumption=t.population*.92;t.food=clip(t.food+yieldFood-consumption,0,5000);const shortage=t.food<Math.max(20,t.population*.12);let growth=shortage?range(-.085,-.025):range(-.018,.051)+t.stability/4500;t.population=Math.max(0,Math.round(t.population*(1+growth)));t.wood=clip(t.wood+t.population*.018-range(0,9),0,1500);t.tech=clip(t.tech+range(-.016,.045)*(t.population>30?1:0),0,12);t.wealth=clip(t.wealth+range(-5,6)+t.population*.014,0,2500);t.stability=clip(t.stability+range(-4,4)+(shortage?-7:1),0,100);if(shortage&&random()<.12)log(t.name+'で食糧難が発生した。');if(t.stability<25&&random()<.16){t.population=Math.round(t.population*.93);t.stability+=12;log(t.name+'で内紛が発生した。')}if(random()<.06)t.belief.share=clip(t.belief.share+range(-.1,.1),0,1);if(t.population===0)log(t.name+'の共同体が消滅した。')});if(year%4===0){const a=choose(towns),b=choose(towns.filter(z=>z!==a));if(a.population>20&&b.population>20){if(random()<.67){const exchange=Math.min(a.food,15);a.food-=exchange;b.food+=exchange;a.wealth+=5;b.wealth+=5;if(random()<.25)log(a.name+'と'+b.name+'の交易が盛んになった。')}else if(random()<.2){warCount++;const lossA=Math.round(a.population*range(.01,.07)),lossB=Math.round(b.population*range(.01,.07));a.population=Math.max(0,a.population-lossA);b.population=Math.max(0,b.population-lossB);a.stability-=7;b.stability-=7;log(a.name+'と'+b.name+'の間で武力衝突が起きた。')}}}if(year%10===0)log('世界暦'+year+'年。諸文明はそれぞれの歴史を重ねてゐる。');drawAll()}
const rules={
'育て':[['農業を拡張した','食糧を蓄へた','子育てを奨励した'],t=>{t.food+=t.population*.35;t.population*=1.035;t.stability+=2}],
'守れ':[['防壁を築いた','財産を保全した','旧来の制度を保護した'],t=>{t.military+=12;t.stability+=5;t.belief.defend=clip(t.belief.defend+.08,0,1)}],
'分けろ':[['食糧を分配した','土地を分割した','権力の分散を進めた'],t=>{t.food-=Math.min(t.food,t.population*.08);t.stability+=(t.belief.share>.5?7:-4);t.belief.share=clip(t.belief.share+.09,0,1)}],
'集めろ':[['備蓄を集積した','軍隊を集結した','交易拠点を建設した'],t=>{t.wealth+=14;t.food+=10;t.military+=8;t.stability-=2}],
'進め':[['未踏地の探索を進めた','軍事遠征を準備した','新技術を開発した'],t=>{t.tech+=.35;t.wealth+=5;t.military+=6;t.belief.explore=clip(t.belief.explore+.1,0,1)}],
'許せ':[['罪人を赦免した','他宗派との和解を試みた','規制を緩和した'],t=>{t.stability+=range(-3,12);t.faith=clip(t.faith+range(-.08,.08),0,1)}],
'燃やせ':[['森林を焼いて農地を開いた','かがり火を焚いた','古い記録を焚書した'],t=>{t.wood=Math.max(0,t.wood-23);t.food+=24;t.stability+=range(-9,3)}],
'待て':[['食糧を備蓄した','外交判断を保留した','儀礼に時間を費した'],t=>{t.food+=20;t.stability+=5;t.tech+=.03}]
};
function oracle(w){oracleCount++;log('【神託 '+oracleCount+'】神は「'+w+'」と告げた。');const result=[];towns.forEach(t=>{const options=rules[w][0];let i;if(w==='分けろ')i=t.belief.share>.65?0:(t.stability<42?2:Math.floor(random()*3));else if(w==='守れ')i=t.belief.defend>.62?0:Math.floor(random()*3);else if(w==='進め')i=t.belief.explore>.6?0:Math.floor(random()*3);else i=Math.floor(random()*3);const obedience=clip(t.faith*.75+range(0,.5),0,1);if(random()<obedience){rules[w][1](t);t.population=Math.round(t.population);t.stability=clip(t.stability,0,100);t.last=w+' → '+options[i];result.push(t.name+'：'+options[i]);}else{t.last=w+' → 聞き流した';result.push(t.name+'：従はなかった');}t.faith=clip(t.faith+range(-.035,.03),0,1)});document.querySelector('#oracle-note').innerHTML='<b>神託「'+w+'」の解釈</b><br>'+result.join('<br>');log(result.join('／'));drawAll()}
function draw(){cx.clearRect(0,0,W,H);cx.fillStyle='#163039';cx.fillRect(0,0,W,H);for(let y=0;y<H;y+=35)for(let x=0;x<W;x+=35){let v=Math.sin(x*.027+y*.022)*Math.cos(y*.027-x*.01);cx.fillStyle=v>.35?'#274a43':v<-.45?'#204552':'#244441';cx.fillRect(x+1,y+1,33,33)}cx.strokeStyle='#5e8585';cx.lineWidth=12;cx.beginPath();cx.moveTo(0,325);cx.bezierCurveTo(230,170,410,530,900,230);cx.stroke();cx.strokeStyle='#83a9a1';cx.lineWidth=3;cx.stroke();for(const t of towns){const r=13+Math.sqrt(t.population)*.7;cx.globalAlpha=t.population===0?.32:1;cx.fillStyle=t.color;cx.beginPath();cx.arc(t.x,t.y,r,0,Math.PI*2);cx.fill();cx.strokeStyle=selected===t.id?'#fff8d5':'#203039';cx.lineWidth=selected===t.id?5:3;cx.stroke();cx.fillStyle='#13252c';cx.fillRect(t.x-8,t.y-7,16,15);cx.fillStyle='#f2e7c7';cx.fillRect(t.x-3,t.y-18,6,12);cx.fillStyle='#fff6dc';cx.textAlign='center';cx.font='bold 15px system-ui';cx.fillText(t.name,t.x,t.y+r+19);cx.font='12px system-ui';cx.fillText(Math.round(t.population)+'人',t.x,t.y+r+34);cx.globalAlpha=1}}
function update(){document.querySelector('#date').textContent='世界暦 '+year+' 年';document.querySelector('#play').textContent=playing?'Ⅱ 停止':'▶ 再生';document.querySelector('#pop').textContent=towns.reduce((s,t)=>s+Math.round(t.population),0).toLocaleString();document.querySelector('#cities').textContent=towns.filter(t=>t.population>0).length;document.querySelector('#conflict').textContent=warCount;const t=towns[selected];document.querySelector('#detail').innerHTML='<b style="color:'+t.color+'">'+t.name+'</b> — '+t.culture+'の共同体<br>人口：'+Math.round(t.population)+'人<br>食糧：'+Math.round(t.food)+' ／ 木材：'+Math.round(t.wood)+'<br>技術：'+t.tech.toFixed(2)+' ／ 富：'+Math.round(t.wealth)+'<br>安定：'+Math.round(t.stability)+' ／ 信仰：'+Math.round(t.faith*100)+'%<br>最新の解釈：'+t.last;document.querySelector('#log').innerHTML=events.slice(0,50).map(e=>'<div class="entry"><em>世界暦 '+e.year+'年</em><br>'+e.text+'</div>').join('')}
function drawAll(){draw();update()}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;let best=1e9;towns.forEach((t,i)=>{const d=Math.hypot(x-t.x,y-t.y);if(d<best&&d<65){best=d;selected=i}});drawAll()});
const box=document.querySelector('#words');words.forEach(w=>{const b=document.createElement('button');b.textContent=w;b.onclick=()=>oracle(w);box.appendChild(b)});
document.querySelector('#play').onclick=()=>{playing=!playing;update()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);playing=true;update()});document.querySelector('#reset').onclick=()=>{if(confirm('現在の世界を破棄しますか？'))init()};
let prev=performance.now(),acc=0;function frame(now){const dt=Math.min(.2,(now-prev)/1000);prev=now;if(playing){acc+=dt*speed;while(acc>.8){acc-=.8;annual()}}requestAnimationFrame(frame)}init();requestAnimationFrame(frame);
</script></body></html>
